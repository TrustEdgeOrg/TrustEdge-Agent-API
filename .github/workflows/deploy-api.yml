name: Build and Deploy trustedge-agent-api

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: trustedge-agent-api
  ECR_REGISTRY: 804012660077.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify AWS deploy secret (org or repo)
        run: |
          echo "secrets.AWS_ROLE_ARN set: ${{ secrets.AWS_ROLE_ARN != '' }}"
          echo "vars.AWS_ROLE_ARN set: ${{ vars.AWS_ROLE_ARN != '' }}"
          if [ "${{ secrets.AWS_ROLE_ARN == '' && vars.AWS_ROLE_ARN == '' }}" = "true" ]; then
            echo "::error::Missing AWS_ROLE_ARN"
            echo ""
            echo "GitHub Free orgs do NOT inject organization secrets into private repos (value is silently empty)."
            echo "Fix: TrustEdge-Agent-API → Settings → Secrets and variables → Actions → Repository secrets"
            echo "  Name:  AWS_ROLE_ARN"
            echo "  Value: arn:aws:iam::804012660077:role/GitHubActionsDeployRole"
            echo ""
            echo "Also add EC2_HOST and EC2_SSH_KEY as repository secrets on TrustEdge-Agent-API."
            echo "If you used Organization variables instead of Secrets, move them to Actions → Secrets."
            exit 1
          fi
          echo "AWS_ROLE_ARN is set."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: bash aws/ensure-ecr-repo.sh

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076

      - name: Build, tag, and push trustedge-agent-api
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest
          if [ "${{ github.ref_name }}" == "develop" ]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              $ECR_REGISTRY/$ECR_REPOSITORY:develop
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:develop
          fi
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          if [ "${{ github.ref_name }}" == "develop" ]; then
            echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:develop" >> "$GITHUB_OUTPUT"
          else
            echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy secrets (org or repo)
        run: |
          echo "secrets.EC2_HOST set: ${{ secrets.EC2_HOST != '' }}"
          echo "secrets.EC2_SSH_KEY set: ${{ secrets.EC2_SSH_KEY != '' }}"
          missing=()
          [ "${{ secrets.EC2_HOST == '' && vars.EC2_HOST == '' }}" = "true" ] && missing+=("EC2_HOST")
          [ "${{ secrets.EC2_SSH_KEY == '' }}" = "true" ] && missing+=("EC2_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "On GitHub Free, use TrustEdge-Agent-API repository secrets (not org secrets) for private repos."
            exit 1
          fi
          echo "Deploy secrets present."

      - name: Deploy trustedge-agent-api on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            TRUSTEDGE_DIR="${TRUSTEDGE_DIR:-$HOME/trustedge}"
            if [ ! -d "$TRUSTEDGE_DIR" ]; then
              echo "ERROR: $TRUSTEDGE_DIR not found. Deploy TrustEdge backend to EC2 first."
              exit 1
            fi
            cd "$TRUSTEDGE_DIR"
            export TRUSTEDGE_AGENT_API_IMAGE="${{ needs.build-and-push.outputs.image }}"
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker pull "$TRUSTEDGE_AGENT_API_IMAGE"

            # EC2 TrustEdge may still use legacy trusttwin compose until rename is on develop.
            if grep -qE '^[[:space:]]*trustedge-agent-api:' docker-compose.yml; then
              MODE=agent
            elif grep -qE '^[[:space:]]*trusttwin-api:' docker-compose.yml; then
              MODE=trusttwin
            else
              echo "ERROR: no agent API service in docker-compose.yml" >&2
              exit 1
            fi
            echo "Detected compose mode: ${MODE}"

            upsert_env() {
              local key="$1" val="$2" file="$3"
              touch "$file"
              if grep -q "^${key}=" "$file" 2>/dev/null; then
                sed -i.bak "s|^${key}=.*|${key}=${val}|" "$file" && rm -f "${file}.bak"
              else
                echo "${key}=${val}" >>"$file"
              fi
            }

            if [ "$MODE" = agent ] && [ -f scripts/ec2-sync-agent-api.sh ]; then
              chmod +x scripts/ec2-sync-agent-api.sh
              bash scripts/ec2-sync-agent-api.sh
            elif [ "$MODE" = trusttwin ] && [ -f scripts/ec2-sync-trusttwin.sh ]; then
              export TRUSTTWIN_API_IMAGE="$TRUSTEDGE_AGENT_API_IMAGE"
              chmod +x scripts/ec2-sync-trusttwin.sh
              bash scripts/ec2-sync-trusttwin.sh
            elif [ "$MODE" = agent ]; then
              upsert_env TRUSTEDGE_AGENT_API_IMAGE "$TRUSTEDGE_AGENT_API_IMAGE" .env
            else
              upsert_env TRUSTTWIN_API_IMAGE "$TRUSTEDGE_AGENT_API_IMAGE" .env
            fi

            if [ "$MODE" = agent ]; then
              if sudo test -f /etc/trustedge/agent-enroll.token; then
                export TRUSTEDGE_AGENT_ENROLL_TOKEN
                TRUSTEDGE_AGENT_ENROLL_TOKEN="$(sudo cat /etc/trustedge/agent-enroll.token | tr -d '\r\n')"
              else
                export TRUSTEDGE_AGENT_ENROLL_TOKEN
                TRUSTEDGE_AGENT_ENROLL_TOKEN="$(sudo cat /etc/trustedge/trusttwin-enroll.token | tr -d '\r\n')"
              fi
              COMPOSE_PROFILES=agent docker compose -f docker-compose.yml up -d --remove-orphans --force-recreate trustedge-agent-api
              COMPOSE_PROFILES=agent docker compose -f docker-compose.yml ps trustedge-agent-api
            else
              export TRUSTTWIN_API_IMAGE="$TRUSTEDGE_AGENT_API_IMAGE"
              export TRUSTTWIN_ENROLL_TOKEN
              TRUSTTWIN_ENROLL_TOKEN="$(sudo cat /etc/trustedge/trusttwin-enroll.token | tr -d '\r\n')"
              COMPOSE_PROFILES=trusttwin docker compose -f docker-compose.yml up -d --remove-orphans --force-recreate trusttwin-api
              COMPOSE_PROFILES=trusttwin docker compose -f docker-compose.yml ps trusttwin-api
            fi
